<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Links do Arnaud</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Figtree:wght@400;600&display=swap">
<style>
:root { --bg: #f6f4f1; --card: #ffffff; --ink: #1d1b19; --muted: #6b655e; --line: #e4dfd8; --red: #8a0303; }
@media (prefers-color-scheme: dark) { :root { --bg: #141312; --card: #1e1c1a; --ink: #f2efeb; --muted: #a39d95; --line: #2e2b28; --red: #c43a3a; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Figtree", system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: calc(40px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
h1 { font-family: "Big Shoulders Display", Impact, sans-serif; font-size: 40px; text-transform: uppercase; margin: 0 0 8px; }
a { display: block; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
a:hover, a:focus-visible { border-color: var(--ink); outline: none; }
a strong { display: block; font-size: 18px; }
a span { color: var(--muted); font-size: 14px; }
.tetra strong::after { content: " ★"; color: #e0b400; }
.tetra { border-left: 4px solid var(--red); }
</style>
</head>
<body>
<main>
  <h1>Links</h1>
  <a href="apartamento/"><strong>Apartamento</strong><span>Compras, tarefas e dia a dia</span></a>
  <a class="tetra" href="churrasco/"><strong>Churrasco do tetra</strong><span>Quem pagou e compras</span></a>
</main>
</body>
</html>
